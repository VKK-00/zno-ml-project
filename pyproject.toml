[project]
name = "zno-ml-project"
version = "0.1.0"
description = "ZNO outcomes: robust ETL, temporal split, models (Ridge/RF/XGB), fairness & importance."
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

# --- Ruff: move select/ignore into the lint table; optionally exclude notebooks ---
[tool.ruff]
line-length = 100
extend-exclude = ["notebooks/**/*.ipynb"]  # remove this line later if you want Ruff to check notebooks

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
