[project]
name = "zno-ml-project"
version = "0.1.0"
description = "ZNO outcomes: robust ETL, temporal split, models (Ridge/RF/XGB), fairness & importance."
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
